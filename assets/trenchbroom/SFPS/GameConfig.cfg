// SFPS -- TrenchBroom game configuration.
//
// Copy this whole SFPS folder to
//     %APPDATA%\TrenchBroom\games\SFPS\
// and set the game path to this repository's assets\ directory. See README.md
// beside this file.
//
// Written against TrenchBroom v2026.1's schema (version 9), which is what
// games\Generic\GameConfig.cfg in that build uses. A config from an older
// version names the texture section "textures" rather than "materials" and
// will not load here.
{
    "version": 9,
    "name": "SFPS",

    // VALVE ONLY, and this is the point rather than an omission.
    //
    // src\brush.c reads Standard faces too -- it derives their axes from
    // Quake's base-axis table exactly as qbsp does, and maptest asserts the two
    // formats produce identical planes. So the engine would load a Standard
    // map fine.
    //
    // What a Standard face CANNOT carry is its own u and v directions, and
    // that is the whole reason this project moved to .map at all: a door with
    // one texture fitted to it was impossible under the old projection. Listing
    // Standard here would put "save the thing that motivated the format change"
    // one dropdown away, with no warning and no visible symptom until somebody
    // looked at the door.
    //
    // Valve만 지원하며, 이는 누락이 아니라 요점입니다. src\brush.c는 Standard 면도 읽습니다.
    // qbsp와 똑같이 Quake의 기저 축 표에서 축을 유도하며, maptest가 두 형식이 동일한 평면을
    // 만들어 냄을 단언합니다. 따라서 엔진은 Standard 맵도 문제없이 불러옵니다.
    //
    // Standard 면이 담을 수 *없는* 것은 자신의 u/v 방향이고, 그것이 이 프로젝트가 .map으로
    // 옮겨 온 이유 전부입니다. 텍스처 한 장이 맞춰진 문은 이전 투영 방식으로 불가능했습니다.
    // 이곳에 Standard를 나열하면 "형식 변경을 촉발한 바로 그것을 저장해 없애는 일"이 드롭다운
    // 하나 거리에 놓이며, 경고도 없고 누군가 그 문을 들여다보기 전까지 증상도 없습니다.
    "fileformats": [
        { "format": "Valve" }
    ],

    // The game path is this repository's assets\ directory, so "." is that.
    // Nothing is packed: bake.ps1 reads the loose files and the editor should
    // read the same ones.
    // 게임 경로는 이 저장소의 assets\ 디렉터리이므로 "."이 곧 그곳입니다. 아무것도 묶여 있지
    // 않습니다. bake.ps1이 낱개 파일을 읽으므로 에디터도 같은 것을 읽어야 합니다.
    "filesystem": {
        "searchpath": ".",
        "packageformat": { "extension": ".pak", "format": "idpak" }
    },

    // POINTS AT assets\sprites, WHICH IS ONLY HALF THE MATERIALS.
    //
    // The wall art is there as PNG -- wall_brick, wall_door and six more -- and
    // those are the ones atrium.map actually textures its walls and its door
    // with, so the face this configuration exists to let you fit a texture to
    // is one you can see.
    //
    // The rest are not images at all. ptile, ppanel, pgrid, pmarble, prust,
    // phex and plava are recipes in assets\textures.txt that tex.c renders at
    // load time, so there is no file for the editor to show and they will
    // appear as missing. Exporting them is a real task and not a small one;
    // until it is done, texture those faces by typing the name.
    //
    // assets\sprites를 가리키며, 이는 재질의 절반뿐입니다. 벽 그림은 그곳에 PNG로 있고
    // (wall_brick, wall_door 외 여섯 개) atrium.map이 벽과 문에 실제로 입히는 것이 그것들이므로,
    // 이 설정이 존재하는 이유인 "텍스처를 맞출 면"은 눈으로 볼 수 있습니다.
    //
    // 나머지는 이미지가 아예 아닙니다. ptile, ppanel, pgrid, pmarble, prust, phex, plava는
    // assets\textures.txt의 레시피이고 tex.c가 로드 시점에 렌더링하므로 에디터가 보여 줄 파일이
    // 없으며 누락으로 나타납니다. 그것을 내보내는 일은 작지 않은 실제 작업입니다. 그때까지 그런
    // 면은 이름을 직접 입력해 텍스처를 지정하십시오.
    "materials": {
        "root": "sprites",
        "format": { "extensions": [".png"], "format": "image" },

        // The monsters and pickups live in the same folder and are not wall
        // materials. Excluded by prefix rather than by moving the files,
        // because sprite.c finds them by the very names listed here.
        // 몬스터와 아이템이 같은 폴더에 있고 그것들은 벽 재질이 아닙니다. 파일을 옮기지 않고
        // 접두사로 제외하는 이유는, sprite.c가 바로 이곳에 나열된 그 이름으로 그것들을 찾기
        // 때문입니다.
        // "excludes", plural. games\Quetoo\GameConfig.cfg is where the spelling
        // comes from; the manual calls it "a list of exclusion patterns" and
        // names no key, and "exclude" is silently ignored rather than rejected.
        // "excludes"이며 복수형입니다. 철자의 출처는 games\Quetoo\GameConfig.cfg입니다. 매뉴얼은
        // 이것을 "제외 패턴 목록"이라 부르고 키 이름은 말하지 않으며, "exclude"는 거부되지 않고
        // 조용히 무시됩니다.
        "excludes": [
            "axe*", "brute*", "caster*", "grenade*", "hound*", "imp*",
            "item*", "rapid*", "shotgun*"
        ]
    },

    "entities": {
        "definitions": [ "SFPS.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },

    // Matches brush_tex_nodraw() in src\brush.c. The same four names, so a face
    // the editor draws as a tag is a face the engine skips -- two lists that
    // disagreed would show a clip brush as solid grey in one and invisible in
    // the other.
    // src\brush.c의 brush_tex_nodraw()와 일치합니다. 같은 네 이름이므로 에디터가 태그로
    // 표시하는 면은 엔진이 건너뛰는 면입니다. 두 목록이 어긋나면 clip 브러시가 한쪽에서는
    // 회색 고체로, 다른 쪽에서는 보이지 않는 것으로 나타납니다.
    "tags": {
        "brush": [
            {
                "name": "Door",
                "attribs": [],
                "match": "classname",
                "pattern": "func_door*"
            },
            {
                "name": "Trigger",
                "attribs": [ "transparent" ],
                "match": "classname",
                "pattern": "trigger*",
                "material": "trigger"
            }
        ],
        "brushface": [
            {
                "name": "Clip",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "clip"
            },
            {
                "name": "Skip",
                "match": "material",
                "pattern": "skip"
            },
            {
                "name": "Trigger",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "trigger"
            },
            {
                "name": "Untextured",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "__TB_empty"
            }
        ]
    },

    // No surface or content flags. Those are Quake 2's, and this engine has no
    // concept behind them -- brush.c reads and discards the three integers a
    // Quake 2 face carries. Declaring flags the game ignores would put them in
    // the inspector for an author to set and wonder about.
    // 표면/내용 플래그가 없습니다. 그것들은 Quake 2의 것이고 이 엔진에는 그 뒤에 아무 개념도
    // 없습니다. brush.c는 Quake 2 면이 지닌 정수 셋을 읽고 버립니다. 게임이 무시하는 플래그를
    // 선언하면 제작자가 설정하고 의아해할 대상이 인스펙터에 놓이게 됩니다.
    "faceattribs": {
        "surfaceflags": [],
        "contentflags": []
    },

    // The same bound BRUSH_MAX_COORD sets in src\brush.h, so the editor warns
    // at exactly the coordinate past which brush_face_poly stops being able to
    // bound a face and reports DIAG_BRUSH_OPEN.
    // src\brush.h의 BRUSH_MAX_COORD가 정하는 것과 같은 경계입니다. 따라서 에디터는
    // brush_face_poly가 면을 한정할 수 없게 되어 DIAG_BRUSH_OPEN을 보고하는 바로 그 좌표에서
    // 경고합니다.
    "softMapBounds": "-16384 -16384 -16384 16384 16384 16384"
}
