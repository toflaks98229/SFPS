{
    "version": 9,
    "name": "SFPS",
    "fileformats": [
        { "format": "Valve" }
    ],
    "filesystem": {
        "searchpath": ".",
        "packageformat": { "extension": ".pak", "format": "idpak" }
    },
    "materials": {
        "root": "sprites",
        "extensions": [ ".png" ],
        "excludes": [
            "axe*", "brute*", "caster*", "grenade*", "hound*", "imp*",
            "item*", "rapid*", "shotgun*", "water_spirit*", "maw*", "ward*",
            "_*"
        ]
    },
    "entities": {
        "definitions": [ "SFPS.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },
    "tags": {
        "brush": [
            {
                "name": "Door",
                "attribs": [],
                "match": "classname",
                "pattern": "func_door*"
            },
            {
                "name": "Trigger",
                "attribs": [ "transparent" ],
                "match": "classname",
                "pattern": "trigger*",
                "material": "trigger"
            }
        ],
        "brushface": [
            {
                "name": "Clip",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "clip"
            },
            {
                "name": "Skip",
                "match": "material",
                "pattern": "skip"
            },
            {
                "name": "Trigger surface",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "trigger"
            },
            {
                "name": "Untextured",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "__TB_empty"
            }
        ]
    },
    "faceattribs": {
        "surfaceflags": [],
        "contentflags": []
    },
    "softMapBounds": "-16384 -16384 -16384 16384 16384 16384"
}
