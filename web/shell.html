<!doctype html>
<!--
  The page SFPS is served on. Deliberately almost nothing.

  A shell file is emscripten's hook for replacing its default page, and the
  default one is a demo harness: a textarea logging stdout, a progress bar, a
  fullscreen button, a table of build options. None of that belongs in front of
  a game, and every line of it is bytes over the wire on a project that counts
  them.

  WHAT IS HERE AND WHY:
    - one canvas, filling the window, with no border and no margin;
    - a black page behind it, so the letterboxing at a ratio the canvas does
      not fill reads as part of the game rather than as the browser showing
      through;
    - a line of text that the runtime replaces, so a slow connection says
      something rather than nothing;
    - tabindex on the canvas, so it can hold keyboard focus.

  {{{ SCRIPT }}} is where emscripten splices its loader in. It must stay.

  SFPS가 서빙되는 페이지입니다. 의도적으로 거의 아무것도 없습니다.

  shell 파일은 emscripten이 자기 기본 페이지를 대체하도록 열어 둔 고리이며, 그 기본 페이지는
  데모용 장치입니다. stdout을 찍는 textarea, 진행 막대, 전체화면 버튼, 빌드 옵션 표. 그중 어느
  것도 게임 앞에 있을 것이 아니고, 바이트를 세는 프로젝트에서 그 모든 줄이 전송량입니다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAGICIAN GIRL MAYHEM</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; outline: none; background: #000; }
  #status {
    position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #8a8a94; font: 14px monospace;
    pointer-events: none;
  }
  #nomouse {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 1rem;
    background: #000; color: #c8c8d0; font: 14px/1.7 monospace;
    text-align: center; padding: 2rem; z-index: 10;
  }
  #nomouse b { color: #e8c87a; font-weight: normal; letter-spacing: .08em; }
  #nomouse a { color: #8a8a94; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">loading…</div>

<!--
  WHAT A TOUCH DEVICE IS SHOWN, which section 6 of docs/WEBGL_PROPOSAL.md left as
  a decision rather than a bug. The controls are WASD and mouse look and there is
  no touch path; a phone that opens this gets a canvas it cannot play.

  A NOTICE RATHER THAN A REFUSAL. The test is `any-pointer: fine` -- whether the
  device has ANY precise pointer at all, not whether it has a touchscreen -- so a
  laptop with both is never asked. And somebody who is sure anyway gets a link
  past it, because a media query is a guess about hardware and being wrong should
  cost a click rather than the whole game.

  *터치 기기에 무엇을 보이는가*이며, docs/WEBGL_PROPOSAL.md의 §6이 버그가 아니라 결정으로 남겨
  둔 것입니다. 조작은 WASD와 마우스 룩뿐이고 터치 경로가 없습니다. 이것을 연 휴대폰은 플레이할
  수 없는 캔버스를 받습니다.

  *거절이 아니라 안내입니다.* 검사는 `any-pointer: fine`, 즉 기기에 정밀 포인터가 *하나라도*
  있는지이며 터치스크린이 있는지가 아닙니다. 그래서 둘 다 가진 노트북은 질문받지 않습니다.
  그리고 그래도 확신하는 사람에게는 지나갈 링크를 줍니다. 미디어 쿼리는 하드웨어에 대한 추측이고,
  틀렸을 때 치르는 값은 게임 전체가 아니라 클릭 하나여야 하기 때문입니다.
-->
<div id="nomouse">
  <b>마우스와 키보드가 필요합니다</b>
  <div>This game is played with WASD and mouse look.<br>There is no touch control.</div>
  <a href="#" id="anyway">try anyway</a>
</div>
<script>
  var statusEl = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    /* Cleared once the runtime is up. The game paints from its first frame, so
       there is nothing to fade -- the line simply stops being the only thing on
       the page.
       런타임이 서면 지웁니다. 게임은 첫 프레임부터 그리므로 페이드할 것이 없고, 이 줄이
       페이지의 유일한 내용이기를 그만둘 뿐입니다. */
    onRuntimeInitialized: function () { if (statusEl) statusEl.remove(); },
    setStatus: function (t) { if (statusEl && t) statusEl.textContent = t; },
    print: function () {},
    printErr: function (t) { console.error(t); }
  };
  /* The canvas takes the keyboard as soon as the page has it, so the first
     WASD does not go to the document and scroll something.
     페이지가 키보드를 갖는 즉시 캔버스가 그것을 가져갑니다. 그래야 첫 WASD가 문서로 가서
     무언가를 스크롤하지 않습니다. */
  window.addEventListener('load', function () { Module.canvas.focus(); });
  Module.canvas.addEventListener('click', function () { Module.canvas.focus(); });

  if (!window.matchMedia || !window.matchMedia('(any-pointer: fine)').matches) {
    var nm = document.getElementById('nomouse');
    nm.style.display = 'flex';
    document.getElementById('anyway').addEventListener('click', function (e) {
      e.preventDefault();
      nm.remove();
      Module.canvas.focus();
    });
  }
</script>
{{{ SCRIPT }}}
</body>
</html>
